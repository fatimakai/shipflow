services:
  - type: web
    name: shipflow-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_PROFILE
        value: public-demo
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: ShipFlow API
      - key: LOG_LEVEL
        value: info
      - key: SWAGGER_ENABLED
        value: "false"
      - key: HTTP_TRUST_PROXY_HOPS
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: 5
      - key: DATABASE_CONNECTION_TIMEOUT_MS
        value: 10000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: TWO_FACTOR_ENCRYPTION_KEY
        generateValue: true
      - key: TWO_FACTOR_ENCRYPTION_KEY_VERSION
        value: 1
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EMAIL_PROVIDER
        value: log
      - key: EMAIL_SUPPORT_ADDRESS
        sync: false
      - key: BILLING_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRODUCT_ID
        sync: false
      - key: STRIPE_PRO_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_PRO_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_AUTOMATIC_TAX_ENABLED
        value: "true"
      - key: FILE_STORAGE_PROVIDER
        value: local
      - key: FILE_LOCAL_ROOT
        value: /tmp/shipflow-files
      - key: FILE_MALWARE_SCAN_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false
