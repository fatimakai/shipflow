name: shipflow

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shipflow}
      POSTGRES_USER: ${POSTGRES_USER:-shipflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipflow_local_password}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - backend

volumes:
  postgres_data:
  clamav_data:

networks:
  backend:
    driver: bridge
